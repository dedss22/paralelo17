<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Harmonia — Álbum de Fotos | Paralelo 17</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0B1612;
            color: #FFFFFF;
        }

        /* Foto de Fundo Totalmente Visível com Gradiente Cinematográfico */
        .hero-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                /* Gradiente suave vertical para destacar o céu e dar profundidade */
                linear-gradient(
                    180deg, 
                    rgba(8, 16, 12, 0.30) 0%, 
                    rgba(8, 16, 12, 0.15) 30%, 
                    rgba(8, 16, 12, 0.50) 65%, 
                    rgba(8, 16, 12, 0.88) 100%
                ),
                /* Vinheta radial para foco elegante */
                radial-gradient(
                    ellipse at 50% 50%,
                    rgba(8, 16, 12, 0.15) 0%,
                    rgba(8, 16, 12, 0.65) 100%
                ),
                url('001%20%E2%80%93%20%C2%A9%20Bruno%20Pinheiro%20%E2%80%93%20DJI_20250122182550_0758_D.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: 1;
            transform: scale(1.02);
            transition: transform 12s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body:hover .hero-background {
            transform: scale(1.05);
        }

        /* Container Central - Sem Rolagem */
        .hero-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        /* Área de Conteúdo Limpa (Sem Nenhum Card ou Caixa Branca) */
        .hero-content {
            position: relative;
            max-width: 860px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Suave difusor fotográfico orgânico no fundo do texto (sem bordas/arestas) */
        .hero-content::before {
            content: '';
            position: absolute;
            inset: -40px -60px;
            background: radial-gradient(ellipse at center, rgba(8, 18, 13, 0.48) 0%, rgba(8, 18, 13, 0) 72%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logomarca Paralelo 17 Grande e Nítida */
        .logo-img {
            max-height: 96px;
            width: auto;
            margin-bottom: 22px;
            filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.65));
            transition: transform 0.35s ease, filter 0.35s ease;
        }

        .logo-img:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 8px 26px rgba(255, 115, 0, 0.35));
        }

        /* Tagline de Localização */
        .location-tag {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #FFA34D;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* Título Principal */
        .property-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: clamp(3.6rem, 7.8vw, 6.2rem);
            font-weight: 700;
            line-height: 1.04;
            color: #FFFFFF;
            margin-bottom: 18px;
            letter-spacing: -0.5px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.85), 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Descrição da Casa */
        .property-description {
            font-size: clamp(1.05rem, 1.8vw, 1.25rem);
            color: rgba(255, 255, 255, 0.94);
            line-height: 1.8;
            font-weight: 300;
            max-width: 690px;
            margin-bottom: 38px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.85), 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* Botão de Ação */
        .action-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-album {
            background: linear-gradient(135deg, #FF7800 0%, #E65500 100%);
            color: #FFFFFF;
            font-size: 1.15rem;
            font-weight: 700;
            padding: 18px 48px;
            border-radius: 40px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 32px rgba(255, 115, 0, 0.45), 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            letter-spacing: 0.4px;
        }

        .btn-album:hover {
            background: linear-gradient(135deg, #FF881A 0%, #F55E00 100%);
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 42px rgba(255, 115, 0, 0.65), 0 6px 18px rgba(0, 0, 0, 0.5);
        }

        .btn-album svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease;
        }

        .btn-album:hover svg {
            transform: translateX(4px);
        }

        .album-stat {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .hero-content {
                padding: 10px;
            }
            .hero-content::before {
                inset: -20px -20px;
            }
            .logo-img {
                max-height: 72px;
                margin-bottom: 16px;
            }
            .location-tag {
                font-size: 0.75rem;
                letter-spacing: 3px;
                margin-bottom: 8px;
            }
            .property-title {
                font-size: 2.8rem;
                margin-bottom: 14px;
            }
            .property-description {
                font-size: 1rem;
                line-height: 1.6;
                margin-bottom: 28px;
            }
            .btn-album {
                font-size: 1rem;
                padding: 16px 32px;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Foto Panorâmica com Gradiente Cinematográfico -->
    <div class="hero-background"></div>

    <!-- Conteúdo Limpo sem Quadrado Branco -->
    <main class="hero-container">
        <div class="hero-content">
            <!-- Logomarca Paralelo 17 -->
            <img src="logo-paralelo17.png" alt="Paralelo 17 Imóveis Únicos" class="logo-img" onerror="this.style.display='none'">
            
            <!-- Tagline -->
            <span class="location-tag">Trancoso • Bahia</span>

            <!-- Título -->
            <h1 class="property-title">Casa Harmonia</h1>
            
            <!-- Descrição -->
            <p class="property-description">
                Refúgio de altíssimo padrão em perfeita harmonia com a natureza exuberante de Trancoso. Uma propriedade exclusiva com 9 suítes, piscina com bar molhado, adega e cinema privativo.
            </p>

            <!-- Acesso ao Álbum -->
            <div class="action-box">
                <a href="album.html" class="btn-album">
                    <span>Acessar Álbum de Fotos</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>
                <span class="album-stat">496 fotografias em alta resolução</span>
            </div>
        </div>
    </main>

</body>
</html>
